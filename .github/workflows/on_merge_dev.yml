name: Deploy dev

# Deploys the "dev" cluster on every merge to the dev branch. Both clusters
# (dev and prod) live on the same OVH VPS, so all the real work — and the
# VPS-wide concurrency lock that keeps the two deploys from colliding — is in
# the shared pipeline. See .github/workflows/deploy_vps.yml for the cluster
# layout and the repository variables/secrets it needs.
on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy_vps.yml
    with:
      deploy_env: dev
      branch: dev
      # Loopback port this cluster's backend is published on, for health checks
      # (prod takes 8000; they must differ on the shared box).
      backend_port: "8001"
    secrets: inherit
