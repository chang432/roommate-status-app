name: Deploy app to OVH "dev" VPS

# Variation of on_merge_dev.yml that deploys to an OVH Public Cloud instance
# instead of a Hetzner VPS, and authenticates SSH with a password (stored as a
# GitHub secret) instead of a private key. It:
#   1. Finds the OVH instance named "dev" via the OpenStack CLI (fails the run
#      if it doesn't exist).
#   2. SSHes in with a password and clones this repo (only if it isn't already
#      present).
#   3. Rebuilds and runs the stack via docker compose (detached).
#
# Required repository secrets (OVH Public Cloud is OpenStack-based; the OS_*
# values come from the "openrc.sh" file OVH generates for an OpenStack user
# under Public Cloud > Users & Roles):
#   OVH_OS_USERNAME     OpenStack user (e.g. "user-abc123")
#   OVH_OS_PASSWORD     that user's OpenStack password
#   OVH_OS_PROJECT_ID   Public Cloud project ID (a.k.a. tenant/serviceName)
#   OVH_OS_REGION_NAME  region the instance lives in (e.g. "GRA11")
#   OVH_SSH_PASSWORD    root password for SSHing into the instance (the
#                       instance must allow password auth for root)
#
# NOTE: manual-trigger only for now. on_merge_dev.yml already deploys every
# push to dev, and running both pipelines on the same merge would duplicate
# the CloudFormation provision and migration jobs concurrently (which can
# race). To cut over to OVH, uncomment the push trigger below and remove it
# from on_merge_dev.yml.
on:
  # push:
  #   branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Provision the DynamoDB infrastructure *before* the app is redeployed:
  # CloudFormation owns table structure (keys, indexes), and code that reads
  # a new table or index must not go live before that structure exists, or
  # every affected request fails outright. A no-op when the templates are
  # unchanged, so this runs on every merge.
  provision:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies (boto3)
        run: pip install -r infrastructure/requirements.txt
      - name: Deploy DynamoDB infrastructure (dev)
        run: python infrastructure/deploy.py --dev

  deploy-dev-vps:
    needs: provision
    runs-on: ubuntu-latest
    # OpenStack auth for every step that talks to OVH. AUTH_URL and the domain
    # names are the same for all OVH Public Cloud accounts, so only the
    # per-account values live in secrets.
    env:
      OS_AUTH_URL: https://auth.cloud.ovh.net/v3
      OS_IDENTITY_API_VERSION: "3"
      OS_USER_DOMAIN_NAME: Default
      OS_PROJECT_DOMAIN_NAME: Default
      OS_USERNAME: ${{ secrets.OVH_OS_USERNAME }}
      OS_PASSWORD: ${{ secrets.OVH_OS_PASSWORD }}
      OS_PROJECT_ID: ${{ secrets.OVH_OS_PROJECT_ID }}
      OS_REGION_NAME: ${{ secrets.OVH_OS_REGION_NAME }}
    steps:
      - name: Setup OpenStack CLI
        run: |
          set -euo pipefail

          pip install --quiet python-openstackclient
          openstack --version

      - name: Find the "dev" VPS
        id: find_dev_vps
        run: |
          set -euo pipefail

          # openstack server show accepts a name or id; a non-zero exit means
          # there is no instance named "dev" in this project/region.
          if ! openstack server show dev -f json > /tmp/dev_vps.json 2>/dev/null; then
            echo "::error::No OVH instance named 'dev' exists. Create it before deploying."
            exit 1
          fi

          # "addresses" is a mapping of network name -> address list on recent
          # openstack clients (e.g. {"Ext-Net": ["1.2.3.4", "2001:..."]}), but
          # a single "Ext-Net=1.2.3.4, 2001:..." string on older ones. Flatten
          # either shape and keep the first IPv4.
          DEV_VPS_IP="$(jq -r '
            .addresses
            | if type == "object" then [.[][]]
              elif type == "string" then [splits("=|, ?")]
              else [] end
            | map(select(type == "string" and test("^([0-9]{1,3}\\.){3}[0-9]{1,3}$")))
            | first // empty
          ' /tmp/dev_vps.json)"
          if [ -z "${DEV_VPS_IP}" ]; then
            echo "::error::Found a 'dev' instance but it has no public IPv4 address."
            exit 1
          fi

          echo "dev VPS public IP: ${DEV_VPS_IP}"
          echo "dev_vps_ip=${DEV_VPS_IP}" >> "$GITHUB_OUTPUT"

      - name: SSH in, clone if needed, rebuild and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_FULL: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH: dev
          GH_PAT_REPO_READ: ${{ secrets.GH_PAT_REPO_READ }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # Public hostname Caddy issues the TLS cert for on this VPS.
          SITE_DOMAIN: ${{ vars.DEV_SITE_DOMAIN }}
          # dev deployment uses its own DynamoDB table (dynamodb-table-dev.yaml).
          ROOMMATE_TABLE: RoommateStatus-dev
          # Web Push (VAPID) keys; empty => push disabled. Generate with
          # docker/flask/gen_vapid.py and store as repo secrets.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        with:
          host: ${{ steps.find_dev_vps.outputs.dev_vps_ip }}
          username: root
          # Password auth (instead of the Hetzner workflow's private key); the
          # instance's sshd must permit it for root.
          password: ${{ secrets.OVH_SSH_PASSWORD }}
          port: 22
          envs: REPO_FULL,REPO_NAME,BRANCH,GH_PAT_REPO_READ,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,SITE_DOMAIN,ROOMMATE_TABLE,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT
          script: |
            set -euo pipefail

            # --- Require the TLS hostname before doing any work -------------
            # Caddy needs SITE_DOMAIN to issue the cert; fail loudly and early
            # (with a clear message) rather than mid-deploy if the repo var is
            # missing. Set it under Settings > Variables > DEV_SITE_DOMAIN.
            if [ -z "${SITE_DOMAIN:-}" ]; then
              echo "SITE_DOMAIN is empty. Set the DEV_SITE_DOMAIN repository variable." >&2
              exit 1
            fi

            # --- Ensure Docker is installed ---------------------------------
            # The "dev" VPS may be a bare box; install Docker + the compose
            # plugin from Docker's apt repo if they aren't already present.
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found; installing…"
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -y
              apt-get install -y ca-certificates curl gnupg
              install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                | gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg
              chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
                > /etc/apt/sources.list.d/docker.list
              apt-get update -y
              apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              systemctl enable --now docker
            fi
            docker --version
            docker compose version

            # --- AWS credentials for the Flask + Caddy containers -----------
            # docker-compose mounts ${HOME}/.aws (=/root/.aws as root) read-only
            # into both the Flask container (boto3 -> DynamoDB) and the Caddy
            # container (route53 DNS-01 -> TLS cert). Materialize the creds
            # passed from GitHub secrets so that mount is populated.
            umask 077
            mkdir -p /root/.aws
            cat > /root/.aws/credentials <<EOF
            [default]
            aws_access_key_id=${AWS_ACCESS_KEY_ID}
            aws_secret_access_key=${AWS_SECRET_ACCESS_KEY}
            EOF
            cat > /root/.aws/config <<EOF
            [default]
            region=${AWS_REGION:-us-east-1}
            EOF

            # --- Clone the repo if it isn't already on the VPS --------------
            APP_DIR="/opt/${REPO_NAME}"
            CLONE_URL="https://${GH_PAT_REPO_READ}@github.com/${REPO_FULL}.git"
            if [ -d "${APP_DIR}/.git" ]; then
              # Already cloned: fast-forward to the latest dev so the merge that
              # triggered this run is what actually gets deployed.
              echo "Repo already present at ${APP_DIR}; updating to origin/${BRANCH}."
              cd "${APP_DIR}"
              git remote set-url origin "${CLONE_URL}"
              git fetch --no-tags origin "${BRANCH}"
              git reset --hard "origin/${BRANCH}"
            else
              echo "Cloning ${REPO_FULL} (${BRANCH}) into ${APP_DIR}."
              git clone --branch "${BRANCH}" "${CLONE_URL}" "${APP_DIR}"
              cd "${APP_DIR}"
            fi

            # --- Rebuild and run the stack ----------------------------------
            # Run the compose commands directly (detached) rather than start.sh,
            # which is built for interactive local dev (it deploys infra, tails
            # logs in the foreground, and tears the stack down on exit). `up -d`
            # returns immediately and leaves the stack running.
            COMPOSE_FILE="${APP_DIR}/docker/docker-compose.yml"
            # Clean rebuild + restart on every deploy: tear the old stack down
            # first, then rebuild the images from the freshly pulled source and
            # force-recreate the containers so nothing stale survives.
            docker compose -f "${COMPOSE_FILE}" down --remove-orphans || true
            docker compose -f "${COMPOSE_FILE}" up --build -d --force-recreate

            # --- Confirm the stack actually came up -------------------------
            echo "Waiting for backend health (up to ~4 min)…"
            ok=0
            for _ in $(seq 1 120); do
              if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done

            if [ "${ok}" -ne 1 ]; then
              echo "Backend did not become healthy. Recent container logs:"
              docker compose -f "${COMPOSE_FILE}" logs --tail 60 || true
              exit 1
            fi
            echo "Deploy succeeded; the dev stack is running."

  # In-place data migrations run *after* the app is redeployed, so the live
  # code already tolerates both the old and new row shapes by the time rows
  # move. A failed migration is auto-reverted and fails this job, but does
  # not roll back the deploy. The runner is a no-op when nothing is pending.
  migrate:
    needs: deploy-dev-vps
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies (boto3)
        run: pip install -r infrastructure/requirements.txt
      - name: Apply pending DynamoDB migrations (dev)
        run: python infrastructure/migrations/runner.py --env dev
