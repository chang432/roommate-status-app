AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DynamoDB tables for the "dev" deployment of the Yorkshire Roomie Status app —
  one table per concern, all keyed by a string id (groups keyed by groupId):
  RoommateStatus-dev (roommates/accounts), plus the -pushsubs, -activities,
  -requests, -spotify-jam, -shows, -checklists, -comment-likes, -groups,
  -memberships, and -migrations tables. See the matching Flask modules in docker/flask/ for each
  table's shape. Table names are fixed per template so the dev and main
  deployments can never accidentally share data (see dynamodb-table-main.yaml
  for the production half).

Resources:
  RoommateStatusTable:
    Type: AWS::DynamoDB::Table
    # Keep the table (and its data) if the stack is deleted. Even on dev,
    # retaining avoids surprise data loss; delete the table manually when you
    # really want a clean slate.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev
      # On-demand capacity: no throughput to manage, pay only for what's used —
      # a good fit for a tiny household app with bursty, low traffic.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # Encrypt at rest with an AWS-owned key (no extra cost).
      SSESpecification:
        SSEEnabled: true
      # Continuous backups so a bad write can be rolled back.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  # Web Push subscriptions for the dev deployment. Separate table (not the
  # roommate table) so the shire scan stays clean. Keyed by a hash of the
  # push endpoint — that stays the partition key so re-subscribing the same
  # device upserts one row instead of duplicating it. UserIdIndex lets a notify
  # fetch only the recipients' devices rather than scanning every subscription;
  # push delivery is best-effort and has no read-your-own-write requirement, so
  # the index's eventual consistency is fine here.
  PushSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-pushsubs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  # Proposed activities for the dev deployment. Separate table; one item per
  # proposal, keyed by a generated id. The app shows only the most recent few.
  ActivitiesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-activities
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  # TV shows for the dev deployment. Separate table; one item per show, keyed by
  # a generated id, with watchers embedded (see docker/flask/household_shows.py).
  ShowsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-shows
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  # Household checklists for the dev deployment. Separate table; one item per
  # checklist, keyed by a generated id, with items embedded (see
  # docker/flask/household_checklists.py).
  ChecklistsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-checklists
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  # Household requests for the dev deployment. Separate table; one item per
  # request, keyed by a generated id, with comments embedded (see
  # docker/flask/household_requests.py).
  RequestsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-requests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  # Spotify Jam for the dev deployment. Separate table; a single
  # activeJam#<group> item per group (absent means no active Jam), see
  # docker/flask/jam.py.
  SpotifyJamTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-spotify-jam
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  # Comment likes for the dev deployment. Separate table; one row per user per
  # liked comment, written by activities.py and household_requests.py. Each row
  # self-describes its parent via activityId or requestId.
  CommentLikesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-comment-likes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  # --- Group-partitioned feed tables (v2) ---------------------------------
  # The five feed tables below supersede the single-`id`-keyed tables above.
  # Every feed read is "give me one group's rows", so groupId is the partition
  # key and id the sort key: a Query replaces a whole-table Scan, the group
  # filter is enforced by the key instead of by Python, and — unlike a GSI —
  # a base-table Query still supports ConsistentRead, which the routes rely on
  # to return the caller's own write immediately.
  #
  # A key schema cannot be altered in place, so these are new tables; the
  # 2026-07-21-01 migration copies the rows across. The superseded tables are
  # left defined (and Retained) until that migration has run on both
  # environments, so `runner.py --revert` has somewhere to put the data back.
  ActivitiesV2Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-activities-v2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  RequestsV2Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-requests-v2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  ChecklistsV2Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-checklists-v2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  ShowsV2Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-shows-v2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  CommentLikesV2Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-comment-likes-v2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  # Groups for the dev deployment. Group attributes remain schemaless beyond
  # the stable groupId partition key.
  GroupsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-groups
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: joinCode
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: JoinCodeIndex
          KeySchema:
            - AttributeName: joinCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  # One row per account/group relationship. The table's primary key makes a
  # household roster query efficient; UserIdIndex powers the home group drawer.
  MembershipsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-memberships
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  # In-place data-migration ledger for the dev deployment. One item per applied
  # migration (id = migration folder name) plus a transient lock item; written
  # by infrastructure/migrations/runner.py, not the app. It is the source of
  # truth for whether a migration has run against these tables.
  MigrationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-migrations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

Outputs:
  TableName:
    Description: Name of the roommate-status DynamoDB table.
    Value: !Ref RoommateStatusTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  TableArn:
    Description: ARN of the roommate-status DynamoDB table.
    Value: !GetAtt RoommateStatusTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TableArn"

  PushTableName:
    Description: Name of the push-subscriptions DynamoDB table.
    Value: !Ref PushSubscriptionsTable
    Export:
      Name: !Sub "${AWS::StackName}-PushTableName"

  PushTableArn:
    Description: ARN of the push-subscriptions DynamoDB table.
    Value: !GetAtt PushSubscriptionsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-PushTableArn"

  ActivitiesTableName:
    Description: Name of the proposed-activities DynamoDB table.
    Value: !Ref ActivitiesTable
    Export:
      Name: !Sub "${AWS::StackName}-ActivitiesTableName"

  ActivitiesTableArn:
    Description: ARN of the proposed-activities DynamoDB table.
    Value: !GetAtt ActivitiesTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ActivitiesTableArn"

  ShowsTableName:
    Description: Name of the TV shows DynamoDB table.
    Value: !Ref ShowsTable
    Export:
      Name: !Sub "${AWS::StackName}-ShowsTableName"

  ShowsTableArn:
    Description: ARN of the TV shows DynamoDB table.
    Value: !GetAtt ShowsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ShowsTableArn"

  ChecklistsTableName:
    Description: Name of the household checklists DynamoDB table.
    Value: !Ref ChecklistsTable
    Export:
      Name: !Sub "${AWS::StackName}-ChecklistsTableName"

  ChecklistsTableArn:
    Description: ARN of the household checklists DynamoDB table.
    Value: !GetAtt ChecklistsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ChecklistsTableArn"

  RequestsTableName:
    Description: Name of the household-requests DynamoDB table.
    Value: !Ref RequestsTable
    Export:
      Name: !Sub "${AWS::StackName}-RequestsTableName"

  RequestsTableArn:
    Description: ARN of the household-requests DynamoDB table.
    Value: !GetAtt RequestsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RequestsTableArn"

  SpotifyJamTableName:
    Description: Name of the Spotify Jam DynamoDB table.
    Value: !Ref SpotifyJamTable
    Export:
      Name: !Sub "${AWS::StackName}-SpotifyJamTableName"

  SpotifyJamTableArn:
    Description: ARN of the Spotify Jam DynamoDB table.
    Value: !GetAtt SpotifyJamTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SpotifyJamTableArn"

  CommentLikesTableName:
    Description: Name of the comment-likes DynamoDB table.
    Value: !Ref CommentLikesTable
    Export:
      Name: !Sub "${AWS::StackName}-CommentLikesTableName"

  CommentLikesTableArn:
    Description: ARN of the comment-likes DynamoDB table.
    Value: !GetAtt CommentLikesTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CommentLikesTableArn"

  ActivitiesV2TableName:
    Description: Name of the group-partitioned proposed-activities DynamoDB table.
    Value: !Ref ActivitiesV2Table
    Export:
      Name: !Sub "${AWS::StackName}-ActivitiesV2TableName"

  ActivitiesV2TableArn:
    Description: ARN of the group-partitioned proposed-activities DynamoDB table.
    Value: !GetAtt ActivitiesV2Table.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ActivitiesV2TableArn"

  RequestsV2TableName:
    Description: Name of the group-partitioned household-requests DynamoDB table.
    Value: !Ref RequestsV2Table
    Export:
      Name: !Sub "${AWS::StackName}-RequestsV2TableName"

  RequestsV2TableArn:
    Description: ARN of the group-partitioned household-requests DynamoDB table.
    Value: !GetAtt RequestsV2Table.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RequestsV2TableArn"

  ChecklistsV2TableName:
    Description: Name of the group-partitioned household-checklists DynamoDB table.
    Value: !Ref ChecklistsV2Table
    Export:
      Name: !Sub "${AWS::StackName}-ChecklistsV2TableName"

  ChecklistsV2TableArn:
    Description: ARN of the group-partitioned household-checklists DynamoDB table.
    Value: !GetAtt ChecklistsV2Table.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ChecklistsV2TableArn"

  ShowsV2TableName:
    Description: Name of the group-partitioned TV shows DynamoDB table.
    Value: !Ref ShowsV2Table
    Export:
      Name: !Sub "${AWS::StackName}-ShowsV2TableName"

  ShowsV2TableArn:
    Description: ARN of the group-partitioned TV shows DynamoDB table.
    Value: !GetAtt ShowsV2Table.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ShowsV2TableArn"

  CommentLikesV2TableName:
    Description: Name of the group-partitioned comment-likes DynamoDB table.
    Value: !Ref CommentLikesV2Table
    Export:
      Name: !Sub "${AWS::StackName}-CommentLikesV2TableName"

  CommentLikesV2TableArn:
    Description: ARN of the group-partitioned comment-likes DynamoDB table.
    Value: !GetAtt CommentLikesV2Table.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CommentLikesV2TableArn"

  GroupsTableName:
    Description: Name of the groups DynamoDB table.
    Value: !Ref GroupsTable
    Export:
      Name: !Sub "${AWS::StackName}-GroupsTableName"

  GroupsTableArn:
    Description: ARN of the groups DynamoDB table.
    Value: !GetAtt GroupsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GroupsTableArn"

  MembershipsTableName:
    Description: Name of the memberships DynamoDB table.
    Value: !Ref MembershipsTable
    Export:
      Name: !Sub "${AWS::StackName}-MembershipsTableName"

  MembershipsTableArn:
    Description: ARN of the memberships DynamoDB table.
    Value: !GetAtt MembershipsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-MembershipsTableArn"

  MigrationsTableName:
    Description: Name of the data-migration ledger DynamoDB table.
    Value: !Ref MigrationsTable
    Export:
      Name: !Sub "${AWS::StackName}-MigrationsTableName"

  MigrationsTableArn:
    Description: ARN of the data-migration ledger DynamoDB table.
    Value: !GetAtt MigrationsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-MigrationsTableArn"
