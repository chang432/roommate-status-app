AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DynamoDB tables for the "dev" deployment of the York Terrace Roomie Status
  app:
    - RoommateStatus-dev: one item per roommate, keyed by a stable string id
      (e.g. "jordan"); name/status/statusText are schemaless, written by the app.
    - RoommateStatus-dev-pushsubs: one item per Web Push subscription, keyed by
      a hash of the push endpoint (see docker/flask/push.py).
    - RoommateStatus-dev-activities: one item per proposed activity, keyed by a
      generated id (see docker/flask/activities.py).

  This is the "-dev" half of the dev/main split (see dynamodb-table-main.yaml
  for the production tables). Table names are fixed per template so the two
  deployments can never accidentally share data.

Resources:
  RoommateStatusTable:
    Type: AWS::DynamoDB::Table
    # Keep the table (and its data) if the stack is deleted. Even on dev,
    # retaining avoids surprise data loss; delete the table manually when you
    # really want a clean slate.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev
      # On-demand capacity: no throughput to manage, pay only for what's used —
      # a good fit for a tiny household app with bursty, low traffic.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # Encrypt at rest with an AWS-owned key (no extra cost).
      SSESpecification:
        SSEEnabled: true
      # Continuous backups so a bad write can be rolled back.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  # Web Push subscriptions for the dev deployment. Separate table (not the
  # roommate table) so the household scan stays clean. Keyed by a hash of the
  # push endpoint; the subscription JSON lives in a non-key attribute.
  PushSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-pushsubs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

  # Proposed activities for the dev deployment. Separate table; one item per
  # proposal, keyed by a generated id. The app shows only the most recent few.
  ActivitiesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-dev-activities
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: dev

Outputs:
  TableName:
    Description: Name of the roommate-status DynamoDB table.
    Value: !Ref RoommateStatusTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  TableArn:
    Description: ARN of the roommate-status DynamoDB table.
    Value: !GetAtt RoommateStatusTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TableArn"

  PushTableName:
    Description: Name of the push-subscriptions DynamoDB table.
    Value: !Ref PushSubscriptionsTable
    Export:
      Name: !Sub "${AWS::StackName}-PushTableName"

  PushTableArn:
    Description: ARN of the push-subscriptions DynamoDB table.
    Value: !GetAtt PushSubscriptionsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-PushTableArn"

  ActivitiesTableName:
    Description: Name of the proposed-activities DynamoDB table.
    Value: !Ref ActivitiesTable
    Export:
      Name: !Sub "${AWS::StackName}-ActivitiesTableName"

  ActivitiesTableArn:
    Description: ARN of the proposed-activities DynamoDB table.
    Value: !GetAtt ActivitiesTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ActivitiesTableArn"
