AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DynamoDB tables for the "main" (production) deployment of the Yorkshire Roomie
  Status app — one table per concern, all keyed by a string id (groups keyed by
  groupId): RoommateStatus-main (roommates/accounts), plus the -pushsubs,
  -activities, -requests, -spotify-jam, -shows, -checklists, -comment-likes,
  -groups, -memberships, and -migrations tables. See the matching Flask modules in
  docker/flask/ for each table's shape. Table names are fixed per template so the
  dev and main deployments can never accidentally share data (see
  dynamodb-table-dev.yaml for the dev half).

Resources:
  RoommateStatusTable:
    Type: AWS::DynamoDB::Table
    # Keep the table (and its data) if the stack is deleted — this is the
    # production table, so never tear it down automatically.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main
      # On-demand capacity: no throughput to manage, pay only for what's used —
      # a good fit for a tiny household app with bursty, low traffic.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # Encrypt at rest with an AWS-owned key (no extra cost).
      SSESpecification:
        SSEEnabled: true
      # Continuous backups so a bad write can be rolled back.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # Web Push subscriptions for the production deployment. Separate table (not
  # the roommate table) so the shire scan stays clean. Keyed by a hash of
  # the push endpoint; the subscription JSON lives in a non-key attribute.
  PushSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-pushsubs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # Proposed activities for the production deployment. Separate table; one item
  # per proposal, keyed by a generated id. The app shows only the most recent few.
  ActivitiesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-activities
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # TV shows for the production deployment. Separate table; one item per show,
  # keyed by a generated id, with watchers embedded.
  ShowsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-shows
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # Household checklists for the production deployment. Separate table; one item
  # per checklist, keyed by a generated id, with items embedded (see
  # docker/flask/household_checklists.py).
  ChecklistsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-checklists
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # Household requests for the production deployment. Separate table; one item
  # per request, keyed by a generated id, with comments embedded (see
  # docker/flask/household_requests.py).
  RequestsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-requests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # Spotify Jam for the production deployment. Separate table; a single
  # activeJam#<group> item per group (absent means no active Jam), see
  # docker/flask/jam.py.
  SpotifyJamTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-spotify-jam
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # Comment likes for the production deployment. Separate table; one row per
  # user per liked comment, written by activities.py and household_requests.py.
  # Each row self-describes its parent via activityId or requestId.
  CommentLikesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-comment-likes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  GroupsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-groups
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: joinCode
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: JoinCodeIndex
          KeySchema:
            - AttributeName: joinCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # One row per account/group relationship. The table's primary key makes a
  # household roster query efficient; UserIdIndex powers the home group drawer.
  MembershipsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-memberships
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # In-place data-migration ledger for the main deployment. One item per applied
  # migration (id = migration folder name) plus a transient lock item; written
  # by infrastructure/migrations/runner.py, not the app. It is the source of
  # truth for whether a migration has run against these tables.
  MigrationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-migrations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

Outputs:
  TableName:
    Description: Name of the roommate-status DynamoDB table.
    Value: !Ref RoommateStatusTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  TableArn:
    Description: ARN of the roommate-status DynamoDB table.
    Value: !GetAtt RoommateStatusTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TableArn"

  PushTableName:
    Description: Name of the push-subscriptions DynamoDB table.
    Value: !Ref PushSubscriptionsTable
    Export:
      Name: !Sub "${AWS::StackName}-PushTableName"

  PushTableArn:
    Description: ARN of the push-subscriptions DynamoDB table.
    Value: !GetAtt PushSubscriptionsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-PushTableArn"

  ActivitiesTableName:
    Description: Name of the proposed-activities DynamoDB table.
    Value: !Ref ActivitiesTable
    Export:
      Name: !Sub "${AWS::StackName}-ActivitiesTableName"

  ActivitiesTableArn:
    Description: ARN of the proposed-activities DynamoDB table.
    Value: !GetAtt ActivitiesTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ActivitiesTableArn"

  ShowsTableName:
    Description: Name of the TV shows DynamoDB table.
    Value: !Ref ShowsTable
    Export:
      Name: !Sub "${AWS::StackName}-ShowsTableName"

  ShowsTableArn:
    Description: ARN of the TV shows DynamoDB table.
    Value: !GetAtt ShowsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ShowsTableArn"

  ChecklistsTableName:
    Description: Name of the household checklists DynamoDB table.
    Value: !Ref ChecklistsTable
    Export:
      Name: !Sub "${AWS::StackName}-ChecklistsTableName"

  ChecklistsTableArn:
    Description: ARN of the household checklists DynamoDB table.
    Value: !GetAtt ChecklistsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ChecklistsTableArn"

  RequestsTableName:
    Description: Name of the household-requests DynamoDB table.
    Value: !Ref RequestsTable
    Export:
      Name: !Sub "${AWS::StackName}-RequestsTableName"

  RequestsTableArn:
    Description: ARN of the household-requests DynamoDB table.
    Value: !GetAtt RequestsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RequestsTableArn"

  SpotifyJamTableName:
    Description: Name of the Spotify Jam DynamoDB table.
    Value: !Ref SpotifyJamTable
    Export:
      Name: !Sub "${AWS::StackName}-SpotifyJamTableName"

  SpotifyJamTableArn:
    Description: ARN of the Spotify Jam DynamoDB table.
    Value: !GetAtt SpotifyJamTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SpotifyJamTableArn"

  CommentLikesTableName:
    Description: Name of the comment-likes DynamoDB table.
    Value: !Ref CommentLikesTable
    Export:
      Name: !Sub "${AWS::StackName}-CommentLikesTableName"

  CommentLikesTableArn:
    Description: ARN of the comment-likes DynamoDB table.
    Value: !GetAtt CommentLikesTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CommentLikesTableArn"

  GroupsTableName:
    Description: Name of the groups DynamoDB table.
    Value: !Ref GroupsTable
    Export:
      Name: !Sub "${AWS::StackName}-GroupsTableName"

  GroupsTableArn:
    Description: ARN of the groups DynamoDB table.
    Value: !GetAtt GroupsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GroupsTableArn"

  MembershipsTableName:
    Description: Name of the memberships DynamoDB table.
    Value: !Ref MembershipsTable
    Export:
      Name: !Sub "${AWS::StackName}-MembershipsTableName"

  MembershipsTableArn:
    Description: ARN of the memberships DynamoDB table.
    Value: !GetAtt MembershipsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-MembershipsTableArn"

  MigrationsTableName:
    Description: Name of the data-migration ledger DynamoDB table.
    Value: !Ref MigrationsTable
    Export:
      Name: !Sub "${AWS::StackName}-MigrationsTableName"

  MigrationsTableArn:
    Description: ARN of the data-migration ledger DynamoDB table.
    Value: !GetAtt MigrationsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-MigrationsTableArn"
