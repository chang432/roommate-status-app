AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DynamoDB tables for the "main" (production) deployment of the Yorkshire Roomie
  Status app — one table per concern: RoommateStatus-main (roommates/accounts),
  plus the -pushsubs, -spotify-jam, -groups, -memberships, and -migrations
  tables, and the group-partitioned -activities-v2, -requests-v2,
  -checklists-v2, -shows-v2, and -comment-likes-v2 feed tables. See the matching
  Flask modules in docker/flask/ for each table's shape. Table names are fixed per template so the
  dev and main deployments can never accidentally share data (see
  dynamodb-table-dev.yaml for the dev half).

Resources:
  RoommateStatusTable:
    Type: AWS::DynamoDB::Table
    # Keep the table (and its data) if the stack is deleted — this is the
    # production table, so never tear it down automatically.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main
      # On-demand capacity: no throughput to manage, pay only for what's used —
      # a good fit for a tiny household app with bursty, low traffic.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # Encrypt at rest with an AWS-owned key (no extra cost).
      SSESpecification:
        SSEEnabled: true
      # Continuous backups so a bad write can be rolled back.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # Web Push subscriptions for the production deployment. Separate table (not
  # the roommate table) so the shire scan stays clean. Keyed by a hash of
  # the push endpoint — that stays the partition key so re-subscribing the same
  # device upserts one row instead of duplicating it. UserIdIndex lets a notify
  # fetch only the recipients' devices rather than scanning every subscription;
  # push delivery is best-effort and has no read-your-own-write requirement, so
  # the index's eventual consistency is fine here.
  PushSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-pushsubs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # Spotify Jam for the production deployment. Separate table; a single
  # activeJam#<group> item per group (absent means no active Jam), see
  # docker/flask/jam.py.
  SpotifyJamTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-spotify-jam
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # --- Group-partitioned feed tables ---------------------------------------
  # Every feed read is "give me one group's rows", so groupId is the partition
  # key and id the sort key: a Query replaces a whole-table Scan, the group
  # filter is enforced by the key instead of by Python, and — unlike a GSI —
  # a base-table Query still supports ConsistentRead, which the routes rely on
  # to return the caller's own write immediately.
  #
  # The `-v2` suffix is historical: a key schema cannot be altered in place, so
  # these replaced id-keyed tables of the same name. A data migration copied the
  # rows across, and the originals were removed from this template once that was
  # confirmed applied on both environments (see git history). Because they
  # carried DeletionPolicy: Retain, those original tables still exist in AWS,
  # unmanaged by CloudFormation, and must be deleted by hand if the data is no
  # longer wanted.
  ActivitiesV2Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-activities-v2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  RequestsV2Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-requests-v2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  ChecklistsV2Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-checklists-v2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  ShowsV2Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-shows-v2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  CommentLikesV2Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-comment-likes-v2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # Book Club keeps long-lived books, sessions, responses, ratings, and
  # chapter posts out of group metadata and the household feed. BookIdIndex
  # reads one book's related records without scanning its group partition.
  BookClubTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-book-club
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: bookId
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: BookIdIndex
          KeySchema:
            - AttributeName: bookId
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  GroupsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-groups
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: joinCode
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: JoinCodeIndex
          KeySchema:
            - AttributeName: joinCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # One row per account/group relationship. The table's primary key makes a
  # household roster query efficient; UserIdIndex powers the home group drawer.
  MembershipsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-memberships
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # In-place data-migration ledger for the main deployment. One item per applied
  # migration (id = migration folder name) plus a transient lock item; written
  # by infrastructure/migrations/runner.py, not the app. It is the source of
  # truth for whether a migration has run against these tables.
  MigrationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-migrations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

Outputs:
  TableName:
    Description: Name of the roommate-status DynamoDB table.
    Value: !Ref RoommateStatusTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  TableArn:
    Description: ARN of the roommate-status DynamoDB table.
    Value: !GetAtt RoommateStatusTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TableArn"

  PushTableName:
    Description: Name of the push-subscriptions DynamoDB table.
    Value: !Ref PushSubscriptionsTable
    Export:
      Name: !Sub "${AWS::StackName}-PushTableName"

  PushTableArn:
    Description: ARN of the push-subscriptions DynamoDB table.
    Value: !GetAtt PushSubscriptionsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-PushTableArn"

  SpotifyJamTableName:
    Description: Name of the Spotify Jam DynamoDB table.
    Value: !Ref SpotifyJamTable
    Export:
      Name: !Sub "${AWS::StackName}-SpotifyJamTableName"

  SpotifyJamTableArn:
    Description: ARN of the Spotify Jam DynamoDB table.
    Value: !GetAtt SpotifyJamTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SpotifyJamTableArn"

  ActivitiesV2TableName:
    Description: Name of the group-partitioned proposed-activities DynamoDB table.
    Value: !Ref ActivitiesV2Table
    Export:
      Name: !Sub "${AWS::StackName}-ActivitiesV2TableName"

  ActivitiesV2TableArn:
    Description: ARN of the group-partitioned proposed-activities DynamoDB table.
    Value: !GetAtt ActivitiesV2Table.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ActivitiesV2TableArn"

  RequestsV2TableName:
    Description: Name of the group-partitioned household-requests DynamoDB table.
    Value: !Ref RequestsV2Table
    Export:
      Name: !Sub "${AWS::StackName}-RequestsV2TableName"

  RequestsV2TableArn:
    Description: ARN of the group-partitioned household-requests DynamoDB table.
    Value: !GetAtt RequestsV2Table.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RequestsV2TableArn"

  ChecklistsV2TableName:
    Description: Name of the group-partitioned household-checklists DynamoDB table.
    Value: !Ref ChecklistsV2Table
    Export:
      Name: !Sub "${AWS::StackName}-ChecklistsV2TableName"

  ChecklistsV2TableArn:
    Description: ARN of the group-partitioned household-checklists DynamoDB table.
    Value: !GetAtt ChecklistsV2Table.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ChecklistsV2TableArn"

  ShowsV2TableName:
    Description: Name of the group-partitioned TV shows DynamoDB table.
    Value: !Ref ShowsV2Table
    Export:
      Name: !Sub "${AWS::StackName}-ShowsV2TableName"

  ShowsV2TableArn:
    Description: ARN of the group-partitioned TV shows DynamoDB table.
    Value: !GetAtt ShowsV2Table.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ShowsV2TableArn"

  CommentLikesV2TableName:
    Description: Name of the group-partitioned comment-likes DynamoDB table.
    Value: !Ref CommentLikesV2Table
    Export:
      Name: !Sub "${AWS::StackName}-CommentLikesV2TableName"

  CommentLikesV2TableArn:
    Description: ARN of the group-partitioned comment-likes DynamoDB table.
    Value: !GetAtt CommentLikesV2Table.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CommentLikesV2TableArn"

  BookClubTableName:
    Description: Name of the group-partitioned Book Club table.
    Value: !Ref BookClubTable
    Export:
      Name: !Sub "${AWS::StackName}-BookClubTableName"

  BookClubTableArn:
    Description: ARN of the group-partitioned Book Club table.
    Value: !GetAtt BookClubTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BookClubTableArn"

  GroupsTableName:
    Description: Name of the groups DynamoDB table.
    Value: !Ref GroupsTable
    Export:
      Name: !Sub "${AWS::StackName}-GroupsTableName"

  GroupsTableArn:
    Description: ARN of the groups DynamoDB table.
    Value: !GetAtt GroupsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GroupsTableArn"

  MembershipsTableName:
    Description: Name of the memberships DynamoDB table.
    Value: !Ref MembershipsTable
    Export:
      Name: !Sub "${AWS::StackName}-MembershipsTableName"

  MembershipsTableArn:
    Description: ARN of the memberships DynamoDB table.
    Value: !GetAtt MembershipsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-MembershipsTableArn"

  MigrationsTableName:
    Description: Name of the data-migration ledger DynamoDB table.
    Value: !Ref MigrationsTable
    Export:
      Name: !Sub "${AWS::StackName}-MigrationsTableName"

  MigrationsTableArn:
    Description: ARN of the data-migration ledger DynamoDB table.
    Value: !GetAtt MigrationsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-MigrationsTableArn"
