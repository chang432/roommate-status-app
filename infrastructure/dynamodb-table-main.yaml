AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DynamoDB tables for the "main" (production) deployment of the Yorkshire
  Roomie Status app:
    - RoommateStatus-main: one item per roommate, keyed by a stable string id
      (e.g. "jordan"); name/status/statusText are schemaless, app-written.
    - RoommateStatus-main-pushsubs: one Web Push subscription per item (push.py).
    - RoommateStatus-main-activities: one proposed activity per item (activities.py).
    - RoommateStatus-main-shows: one TV show per item, watchers embedded
      (household_shows.py).
    - RoommateStatus-main-checklists: one household checklist per item
      (household_checklists.py).
    - RoommateStatus-main-comment-likes: one row per user per liked comment
      (activities.py, household_requests.py).
    - RoommateStatus-main-groups: one group per item, keyed by groupId.

  The "-main" half of the dev/main split (see dynamodb-table-dev.yaml for the
  dev tables); table names are fixed per template so the two deployments can
  never accidentally share data.

Resources:
  RoommateStatusTable:
    Type: AWS::DynamoDB::Table
    # Keep the table (and its data) if the stack is deleted — this is the
    # production table, so never tear it down automatically.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main
      # On-demand capacity: no throughput to manage, pay only for what's used —
      # a good fit for a tiny household app with bursty, low traffic.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # Encrypt at rest with an AWS-owned key (no extra cost).
      SSESpecification:
        SSEEnabled: true
      # Continuous backups so a bad write can be rolled back.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # Web Push subscriptions for the production deployment. Separate table (not
  # the roommate table) so the shire scan stays clean. Keyed by a hash of
  # the push endpoint; the subscription JSON lives in a non-key attribute.
  PushSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-pushsubs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # Proposed activities for the production deployment. Separate table; one item
  # per proposal, keyed by a generated id. The app shows only the most recent few.
  ActivitiesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-activities
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # TV shows for the production deployment. Separate table; one item per show,
  # keyed by a generated id, with watchers embedded.
  ShowsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-shows
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # Household checklists for the production deployment. Separate table; one item
  # per checklist, keyed by a generated id, with items embedded (see
  # docker/flask/household_checklists.py).
  ChecklistsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-checklists
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # Comment likes for the production deployment. Separate table; one row per
  # user per liked comment, written by activities.py and household_requests.py.
  # Each row self-describes its parent via activityId or requestId.
  CommentLikesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-comment-likes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  GroupsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-groups
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: joinCode
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: JoinCodeIndex
          KeySchema:
            - AttributeName: joinCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

  # In-place data-migration ledger for the main deployment. One item per applied
  # migration (id = migration folder name) plus a transient lock item; written
  # by infrastructure/migrations/runner.py, not the app. It is the source of
  # truth for whether a migration has run against these tables.
  MigrationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RoommateStatus-main-migrations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: main

Outputs:
  TableName:
    Description: Name of the roommate-status DynamoDB table.
    Value: !Ref RoommateStatusTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  TableArn:
    Description: ARN of the roommate-status DynamoDB table.
    Value: !GetAtt RoommateStatusTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TableArn"

  PushTableName:
    Description: Name of the push-subscriptions DynamoDB table.
    Value: !Ref PushSubscriptionsTable
    Export:
      Name: !Sub "${AWS::StackName}-PushTableName"

  PushTableArn:
    Description: ARN of the push-subscriptions DynamoDB table.
    Value: !GetAtt PushSubscriptionsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-PushTableArn"

  ActivitiesTableName:
    Description: Name of the proposed-activities DynamoDB table.
    Value: !Ref ActivitiesTable
    Export:
      Name: !Sub "${AWS::StackName}-ActivitiesTableName"

  ActivitiesTableArn:
    Description: ARN of the proposed-activities DynamoDB table.
    Value: !GetAtt ActivitiesTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ActivitiesTableArn"

  ShowsTableName:
    Description: Name of the TV shows DynamoDB table.
    Value: !Ref ShowsTable
    Export:
      Name: !Sub "${AWS::StackName}-ShowsTableName"

  ShowsTableArn:
    Description: ARN of the TV shows DynamoDB table.
    Value: !GetAtt ShowsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ShowsTableArn"

  ChecklistsTableName:
    Description: Name of the household checklists DynamoDB table.
    Value: !Ref ChecklistsTable
    Export:
      Name: !Sub "${AWS::StackName}-ChecklistsTableName"

  ChecklistsTableArn:
    Description: ARN of the household checklists DynamoDB table.
    Value: !GetAtt ChecklistsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ChecklistsTableArn"

  CommentLikesTableName:
    Description: Name of the comment-likes DynamoDB table.
    Value: !Ref CommentLikesTable
    Export:
      Name: !Sub "${AWS::StackName}-CommentLikesTableName"

  CommentLikesTableArn:
    Description: ARN of the comment-likes DynamoDB table.
    Value: !GetAtt CommentLikesTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CommentLikesTableArn"

  GroupsTableName:
    Description: Name of the groups DynamoDB table.
    Value: !Ref GroupsTable
    Export:
      Name: !Sub "${AWS::StackName}-GroupsTableName"

  GroupsTableArn:
    Description: ARN of the groups DynamoDB table.
    Value: !GetAtt GroupsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GroupsTableArn"

  MigrationsTableName:
    Description: Name of the data-migration ledger DynamoDB table.
    Value: !Ref MigrationsTable
    Export:
      Name: !Sub "${AWS::StackName}-MigrationsTableName"

  MigrationsTableArn:
    Description: ARN of the data-migration ledger DynamoDB table.
    Value: !GetAtt MigrationsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-MigrationsTableArn"
