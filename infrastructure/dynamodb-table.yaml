AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DynamoDB table for the York Terrace Roomie Status app. Stores one item per
  roommate, keyed by a stable string id (e.g. "jordan"). Non-key attributes
  such as name, status, and statusText are schemaless and written by the app.

Parameters:
  TableName:
    Type: String
    Default: RoommateStatus
    Description: Name of the DynamoDB table to create.
    AllowedPattern: "[a-zA-Z0-9_.-]+"
    MinLength: 3
    MaxLength: 255

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment, applied as a tag.

Resources:
  RoommateStatusTable:
    Type: AWS::DynamoDB::Table
    # Keep the table (and its data) if the stack is deleted; flip to Delete for
    # throwaway/dev stacks if you prefer automatic teardown.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      # On-demand capacity: no throughput to manage, pay only for what's used —
      # a good fit for a tiny household app with bursty, low traffic.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # Encrypt at rest with an AWS-owned key (no extra cost).
      SSESpecification:
        SSEEnabled: true
      # Continuous backups so a bad write can be rolled back.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: roomie-status
        - Key: Environment
          Value: !Ref Environment

Outputs:
  TableName:
    Description: Name of the created DynamoDB table.
    Value: !Ref RoommateStatusTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  TableArn:
    Description: ARN of the created DynamoDB table.
    Value: !GetAtt RoommateStatusTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TableArn"
