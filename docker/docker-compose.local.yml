# Local-dev override for docker-compose.yml. Publishes the cluster's ports on
# the host (the base file publishes none, because on the VPS the shared edge
# proxy owns 80/443) and connects the app to the local DynamoDB module. Layer it
# on top of the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# start.sh does this automatically and, as a separate compose project, runs
# infrastructure/docker-compose.dynamodb-local.yml (the in-memory DynamoDB Local
# this app dials over the shared network). The deploy overlay
# (docker-compose.deploy.yml) is what the workflow layers on instead, leaving the
# real-AWS config and the edge-proxied HTTPS untouched.
#
# Caddy serves plain HTTP here exactly as it does inside a deployed cluster, so
# it never contacts Let's Encrypt locally (no public cert churn, no rate-limit
# burn, no /etc/hosts games). http://localhost is still a browser "secure
# context", so service workers / the push API work; the real iPhone push test
# needs the VPS.

# The shared network the local DynamoDB module also joins. External: created
# once (`docker network create roomie-shared`, done by start.sh) and owned by
# neither project. Without this override the app uses its own default network and
# real AWS — the deployed clusters are unaffected.
networks:
  roomie-shared:
    external: true

services:
  caddy:
    ports:
      # Only one stack runs locally, so Caddy can have the host's port 80 —
      # http://localhost is the app.
      - "80:80"

  # Connect the app to the local DynamoDB module: dial it by name over the shared
  # network, with throwaway creds (DynamoDB Local ignores them, but boto3 still
  # needs some). DYNAMODB_ENDPOINT is the only switch that points the app at the
  # local DB; without it the app talks to real AWS. flask stays on `default` too
  # so Caddy can keep proxying to it.
  flask:
    ports:
      # Direct backend access for probing/debugging (http://localhost:8000).
      - "8000:8000"
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=us-east-1
    networks:
      - default
      - roomie-shared
