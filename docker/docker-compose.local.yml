# Local-dev override for docker-compose.yml. Swaps Caddy to serve plain HTTP on
# localhost so it never touches Let's Encrypt / Route 53 (no public cert churn,
# no rate-limit burn, no /etc/hosts games). Layer it on top of the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# start.sh does this automatically, and also layers in
# infrastructure/docker-compose.dynamodb-local.yml (the in-memory DynamoDB Local
# that lets the stack run with no AWS account). The base file (what the deploy
# workflow runs with an explicit single -f) keeps the production DNS-01 /
# real-AWS config untouched.
services:
  caddy:
    # Replace the baked-in DNS-01 Caddyfile with the plain-HTTP local one.
    volumes:
      - "./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro"
