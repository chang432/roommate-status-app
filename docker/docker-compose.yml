# Builds and runs the full Roomie Status stack: the Flask backend and the
# Caddy container that serves the React frontend, proxies /api to Flask, and
# terminates HTTPS with a Let's Encrypt cert issued via HTTP-01.
#
# SITE_DOMAIN must be set to the public hostname the cert is issued for, e.g.
#   SITE_DOMAIN=dev.example.com docker compose up --build
# then open https://$SITE_DOMAIN

services:
  flask:
    build:
      # Flask Dockerfile and source live in docker/flask.
      context: ./flask
    image: roomie-backend
    container_name: roomie-backend
    expose:
      # Reachable to other compose services (caddy) as flask:8000. Also mapped
      # to the host below for direct backend access / debugging.
      - "8000"
    ports:
      - "8000:8000"
    environment:
      # DynamoDB table the backend reads/writes. Defaults to the production
      # table (infrastructure/dynamodb-table-main.yaml); the dev deployment
      # overrides ROOMMATE_TABLE to RoommateStatus-dev.
      - ROOMMATE_TABLE=${ROOMMATE_TABLE:-RoommateStatus-main}
      # Region for boto3. Override to match where the table was deployed.
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # Web Push (VAPID) keys for notifications. Generate with
      # docker/flask/gen_vapid.py and set as secrets/env. Empty => push disabled
      # (the app still runs; /api/push/* report "not configured").
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:andre888chang@gmail.com}
      # Available-roommate count that triggers the gather push (PROJECT.md: 3).
      - AVAILABLE_THRESHOLD=${AVAILABLE_THRESHOLD:-3}
    volumes:
      # Mount the host's AWS credentials read-only so boto3 in the Flask app can
      # use them. The container runs as root, so they land in /root/.aws where
      # the AWS SDK looks by default.
      - "${HOME}/.aws:/root/.aws:ro"
    restart: unless-stopped

  caddy:
    build:
      # Context is the repo root so the build can reach frontend/ and the
      # Caddyfile under docker/caddy.
      context: ..
      dockerfile: docker/caddy/Dockerfile
    image: roomie-frontend
    container_name: roomie-frontend
    ports:
      # 80 for the automatic HTTP->HTTPS redirect, 443 for the TLS-served site.
      - "80:80"
      - "443:443"
    environment:
      # Public hostname the TLS cert is issued for. Required; the stack refuses
      # to start without it so Caddy never tries to provision a cert for a
      # placeholder. Each VPS sets its own (dev. vs apex).
      - SITE_DOMAIN=${SITE_DOMAIN:-dev.roomie-status.eu}
    volumes:
      # Persist issued certs + ACME account across rebuilds so every deploy
      # doesn't re-issue (and risk hitting Let's Encrypt rate limits).
      - "caddy_data:/data"
      - "caddy_config:/config"
    depends_on:
      - flask
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
