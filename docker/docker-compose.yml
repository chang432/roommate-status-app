# Builds and runs one Roomie Status app *cluster*: the Flask backend and the
# Caddy container that serves the React frontend and proxies /api to Flask.
#
# A cluster publishes no host ports and terminates no TLS. Public HTTPS belongs
# to the shared edge proxy (docker/edge/docker-compose.yml), which routes by
# hostname into each cluster — that is what lets the dev and prod clusters live
# on the same VPS. Everything that must not collide between two clusters on one
# host (image tags, container names) is keyed by DEPLOY_ENV, and the clusters
# are kept apart by their compose project names:
#
#   DEPLOY_ENV=dev BACKEND_PORT=8001 docker compose -p roomie-dev \
#     -f docker/docker-compose.yml -f docker/docker-compose.deploy.yml \
#     up -d --build
#
# Local dev layers docker-compose.local.yml instead, which publishes the ports
# and points the app at DynamoDB Local; see start.sh.

services:
  flask:
    build:
      # Flask Dockerfile and source live in docker/flask.
      context: ./flask
    # Tag per cluster: a dev build must never move the tag whose image the prod
    # containers were created from (and vice versa).
    image: roomie-backend:${DEPLOY_ENV:-local}
    container_name: roomie-${DEPLOY_ENV:-local}-backend
    expose:
      # Reachable to other services in this cluster (caddy) as flask:8000. The
      # deploy overlay also publishes it on loopback for health checks.
      - "8000"
    environment:
      # DynamoDB table the backend reads/writes. Defaults to the production
      # table (infrastructure/dynamodb-table-main.yaml); the dev deployment
      # overrides ROOMMATE_TABLE to RoommateStatus-dev.
      - ROOMMATE_TABLE=${ROOMMATE_TABLE:-RoommateStatus-main}
      # Region for boto3. Override to match where the table was deployed.
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # Web Push (VAPID) keys for notifications. Generate with
      # docker/flask/gen_vapid.py and set as secrets/env. Empty => push disabled
      # (the app still runs; /api/push/* report "not configured").
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:andre888chang@gmail.com}
      # Available-roommate count that triggers the gather push (PROJECT.md: 3).
      - AVAILABLE_THRESHOLD=${AVAILABLE_THRESHOLD:-3}
    volumes:
      # Mount the host's AWS credentials read-only so boto3 in the Flask app can
      # use them. The container runs as root, so they land in /root/.aws where
      # the AWS SDK looks by default. Both clusters share one credentials file.
      - "${HOME}/.aws:/root/.aws:ro"
    restart: unless-stopped

  caddy:
    build:
      # Context is the repo root so the build can reach frontend/ and the
      # Caddyfile under docker/caddy.
      context: ..
      dockerfile: docker/caddy/Dockerfile
    image: roomie-frontend:${DEPLOY_ENV:-local}
    container_name: roomie-${DEPLOY_ENV:-local}-frontend
    expose:
      # Plain HTTP, reached by the edge proxy (deploy) or published to the host
      # (local). Nothing here listens on 443.
      - "80"
    depends_on:
      - flask
    restart: unless-stopped
