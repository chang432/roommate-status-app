server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: fall back to index.html so client-side (react-router)
    # routes resolve instead of 404ing on deep links / refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Flask backend container. The `flask` hostname is
    # the service name from docker-compose.yml; the /api prefix is preserved
    # because the Flask routes are themselves mounted under /api.
    location /api/ {
        proxy_pass http://flask:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache hashed static assets aggressively; Vite fingerprints filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
